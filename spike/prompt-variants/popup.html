<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 12px/1.4 system-ui, sans-serif; width: 640px; margin: 8px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border-bottom: 1px solid #ddd; padding: 2px 4px; text-align: left; vertical-align: top; }
  th { background: #f4f4f4; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="row">
    <label><input type="checkbox" id="liveEnabled"> live mode (measure only)</label>
    <label>pipeline <select id="liveVariant"></select></label>
    <button id="bench">Open bench</button>
    <button id="copy">Copy live results JSON</button>
    <button id="clear">Clear</button>
    <span id="msg"></span>
  </div>
  <div style="color:#666">ms since navigation start. banner→decision = latency to compare with a human clicking Reject. Reload the page after changing settings.</div>
  <table>
    <thead><tr><th>page</th><th>vendor</th><th>found@</th><th>banner→decision</th><th>state</th><th>output</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script src="popup.js"></script>
</body>
</html>
