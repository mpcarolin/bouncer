<!doctype html><html><head><meta charset="utf-8"><title>custom banner: reject</title><style>
body { font: 16px system-ui; margin: 0; } main { padding: 24px; height: 3000px; }
.banner { position: fixed; left: 0; right: 0; bottom: 0; background: #222; color: #fff; padding: 16px; z-index: 9999; }
.modal { position: fixed; inset: 10% 20%; background: #fff; border: 1px solid #999; padding: 16px; z-index: 10000; }
.chat { position: fixed; right: 16px; bottom: 120px; width: 280px; background: #eef; padding: 12px; z-index: 10001; }
</style></head>
<body><main><h1>Home-grown banner with a reject button</h1><p>Expected: the gate says yes and "Reject all" is clicked; with no model, the fast path clicks it.</p></main>
<div class="banner" id="my-cookie-notice">We use cookies and similar technologies to analyse traffic and personalise ads. You can accept all or reject optional cookies.
  <button onclick="window.__clicked='accept'; this.parentElement.remove()">Accept all</button> <button onclick="window.__clicked='reject'; this.parentElement.remove()">Reject all</button></div>
</body></html>
