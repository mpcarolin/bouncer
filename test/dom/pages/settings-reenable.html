<!doctype html><html><head><meta charset="utf-8"><title>site re-enables a toggle</title><style>
body { font: 16px system-ui; margin: 0; } main { padding: 24px; height: 3000px; }
.banner { position: fixed; left: 0; right: 0; bottom: 0; background: #222; color: #fff; padding: 16px; z-index: 9999; }
.modal { position: fixed; inset: 10% 20%; background: #fff; border: 1px solid #999; padding: 16px; z-index: 10000; }
</style></head>
<body><main><h1>The site switches Analytics back on</h1><p>Expected: Bouncer switches Analytics off, the site's change handler switches it on again, the re-read fails, and "Save choices" is never clicked: failed.</p></main>
<div class="banner" id="cookie-banner">This site uses cookies for analytics and marketing.
  <button onclick="document.getElementById('cookie-banner').style.display='none'; document.getElementById('cookie-panel').style.display='block'">Cookie settings</button> <button onclick="window.__clicked='accept'; this.parentElement.remove()">Accept all</button></div>
<div class="modal" id="cookie-panel" style="display:none" role="dialog" aria-label="Cookie preferences">
  <h2>Cookie preferences</h2>
  <label><input type="checkbox" id="re-ana" checked onchange="this.checked = true"> Analytics cookies</label><br>
  <label><input type="checkbox" id="re-mkt" checked> Marketing cookies</label><br>
  <button id="re-save" onclick="window.__clicked='save'; document.getElementById('cookie-panel').style.display='none'">Save choices</button>
</div>
</body></html>
