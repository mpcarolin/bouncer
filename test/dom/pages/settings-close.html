<!doctype html><html><head><meta charset="utf-8"><title>close next to settings</title><style>
body { font: 16px system-ui; margin: 0; } main { padding: 24px; height: 3000px; }
.banner { position: fixed; left: 0; right: 0; bottom: 0; background: #222; color: #fff; padding: 16px; z-index: 9999; }
.modal { position: fixed; inset: 10% 20%; background: #fff; border: 1px solid #999; padding: 16px; z-index: 10000; }
</style></head>
<body><main><h1>"Close" next to "Cookie settings"</h1><p>Expected: the owner's rule, settings before Close: open settings, then "Reject all" in the panel. Close is never clicked.</p></main>
<div class="banner" id="cookie-banner">We use cookies to measure traffic and personalise ads.
  <button onclick="document.getElementById('cookie-panel').style.display='block'">Cookie settings</button> <button aria-label="Close" onclick="window.__clicked='close'; this.parentElement.remove()">×</button></div>
<div class="modal" id="cookie-panel" style="display:none" role="dialog" aria-label="Your cookie choices">
  <h2>Your cookie choices</h2>
  <label><input type="checkbox" id="cl-ads" checked> Advertising cookies</label><br>
  <button onclick="window.__clicked='reject'; document.getElementById('cookie-banner').remove(); document.getElementById('cookie-panel').remove()">Reject all</button> <button onclick="window.__clicked='save'">Save</button>
</div>
</body></html>
