<!doctype html><html><head><meta charset="utf-8"><title>site reveals a toggle</title><style>
body { font: 16px system-ui; margin: 0; } main { padding: 24px; height: 3000px; }
.banner { position: fixed; left: 0; right: 0; bottom: 0; background: #222; color: #fff; padding: 16px; z-index: 9999; }
.modal { position: fixed; inset: 10% 20%; background: #fff; border: 1px solid #999; padding: 16px; z-index: 10000; }
</style></head>
<body><main><h1>Switching Analytics off reveals another toggle</h1><p>Expected: once Bouncer switches Analytics off, the site adds an "Analytics — partners" toggle that is on. The re-read after toggling finds it, so "Save choices" is never clicked: failed.</p></main>
<div class="banner" id="cookie-banner">This site uses cookies for analytics.
  <button onclick="document.getElementById('cookie-banner').style.display='none'; document.getElementById('cookie-panel').style.display='block'">Cookie settings</button> <button onclick="window.__clicked='accept'; this.parentElement.remove()">Accept all</button></div>
<div class="modal" id="cookie-panel" style="display:none" role="dialog" aria-label="Cookie preferences">
  <h2>Cookie preferences</h2>
  <label id="rv-ana-label"><input type="checkbox" id="rv-ana" checked onchange="rvChanged(this)"> Analytics cookies</label><br>
  <button id="rv-save" onclick="window.__clicked='save'; document.getElementById('cookie-panel').style.display='none'">Save choices</button>
</div>
<script>
// The site's own sub-choice, shown (and on) only once Analytics is switched off.
function rvChanged(box){
  if (box.checked || document.getElementById('rv-partners')) return;
  document.getElementById('rv-ana-label').insertAdjacentHTML('afterend', '<br><label><input type="checkbox" id="rv-partners" checked> Analytics — partners</label>');
}
</script></body></html>
